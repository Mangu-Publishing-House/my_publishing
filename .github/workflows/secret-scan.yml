name: secret-scan
# REPO_AUDIT_2026-08-21 F6.3: no secret-scanning step exists on the canonical
# deploy path today. This is intentionally a SEPARATE, non-required workflow
# rather than a step added to `ci.yml` (the sole required check) — gitleaks
# has never run against this repo's ~78-commit history, and F6 already found
# that several `sk_/whsec_/eyJ…/mongodb+srv://` matches in the tree are
# placeholders/CI dummies/test fixtures/detector regexes, not real secrets.
# A first run could plausibly false-positive on those and block every PR,
# including unrelated ones, if wired in as required from day one.
#
# Intended rollout: this reports findings without gating merges. Once a human
# reviews the first run's output (allowlisting any confirmed-safe fixtures via
# a `.gitleaksignore` if needed), promote it to a required status check in
# branch protection settings — that step needs console access this workflow
# file can't grant itself. Tracked in HUMAN_TASKS.md.
#
# Uses the gitleaks CLI binary directly (checksum-verified), NOT the
# `gitleaks/gitleaks-action` marketplace wrapper: that wrapper now requires a
# paid GITLEAKS_LICENSE secret for organization-owned repos (a breaking
# change in gitleaks' pricing model — https://github.com/gitleaks/gitleaks-action#-announcement),
# which this repo doesn't have and can't self-provision. The underlying CLI
# itself remains free/open-source (MIT) with no such gate; only the Action
# wrapper is licensed.
#
# This job is EXPECTED to keep failing (exit 1, "leaks found: 3") until
# HUMAN_TASKS.md's H0.1 is completed — see .gitleaksignore's header for why
# those 3 findings are deliberately left unignored rather than suppressed.
# Non-required, so this doesn't block merges either way.
on:
  pull_request:
    branches: [main, 'audit/**', 'task/**']
  push:
    branches: [main]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (checksum-verified, not the licensed Action wrapper)
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          echo "${GITLEAKS_SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "${ASSET}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history for secrets
        run: gitleaks detect --source . --verbose --redact
